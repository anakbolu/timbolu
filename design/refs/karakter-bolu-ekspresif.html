<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolu — karakter blob ekspresif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --panel:#FFFFFF; --text:#1E1B2E; --muted:#6B6880; --line:#E1E3EC;
  --stage-s:75%; --stage-l:95%; --dot-l:86%;
  --h:24;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151D; --panel:#201E2A; --text:#F1EFF8; --muted:#A3A0B5; --line:#34313F;
    --stage-s:22%; --stage-l:16%; --dot-l:25%;
  }
}
:root[data-theme="dark"]{
  --bg:#16151D; --panel:#201E2A; --text:#F1EFF8; --muted:#A3A0B5; --line:#34313F;
  --stage-s:22%; --stage-l:16%; --dot-l:25%;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font-family:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.45}
.wrap{max-width:1140px;margin:0 auto;padding:28px 20px 48px}
header{margin-bottom:20px}
h1{font-size:clamp(40px,7vw,64px);line-height:1;margin:0;font-weight:700;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted);font-size:18px;max-width:60ch}
main{display:grid;gap:20px}
@media (min-width:880px){main{grid-template-columns:minmax(0,1.1fr) minmax(320px,1fr);align-items:start}}

.stage{position:relative;border-radius:32px;overflow:hidden;aspect-ratio:1/1;
  background-color:hsl(var(--h) var(--stage-s) var(--stage-l));
  background-image:radial-gradient(hsl(var(--h) 40% var(--dot-l)) 1.3px,transparent 1.6px);
  background-size:20px 20px;transition:background-color .4s;display:grid;place-items:center}
#holder{width:84%;height:84%;position:relative}
#sqw,#rig{position:absolute;inset:0;transform-origin:50% 88%}
#svgwrap{position:absolute;inset:0;will-change:transform}
#svgwrap svg{width:100%;height:100%;cursor:pointer;overflow:visible;touch-action:manipulation}
#fur{position:absolute;left:-10%;top:-10%;width:120%;height:120%;display:none;pointer-events:none}
.is3d #fur{display:block}
.is3d #svgwrap .body,.is3d #svgwrap .feet{visibility:hidden}
.shadow{position:absolute;left:28%;width:44%;top:79%;height:6%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(30,20,60,.18),rgba(30,20,60,0));pointer-events:none}
.pat{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;animation:pat 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.pat svg{width:100%;height:100%;display:block}
@keyframes pat{0%{transform:translate(0,0) scale(0);opacity:1}25%{transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(var(--s))}100%{transform:translate(var(--dx),var(--dy)) scale(calc(var(--s)*.8));opacity:0}}
.slider{display:flex;align-items:center;gap:12px;font-weight:500;margin-top:6px}
.slider input{flex:1;accent-color:hsl(var(--h) 70% 50%)}
.err{color:#d6334a;font-size:14px;margin:10px 0 0}
.caption{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:20px;font-weight:500;opacity:.75}

.panel{background:var(--panel);border-radius:28px;padding:22px;border:1px solid var(--line)}
.panel section+section{margin-top:22px}
h2{font-size:17px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:16px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.chip kbd{font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip[aria-pressed="true"] kbd{color:var(--bg);border-color:var(--bg);opacity:.7}

.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.shape-btn{border:2px solid var(--line);background:transparent;border-radius:18px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:500}
.shape-btn svg{width:34px;height:34px;overflow:visible}
.shape-btn[aria-pressed="true"]{border-color:var(--text);background:hsl(var(--h) var(--stage-s) var(--stage-l))}

.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
.picker{position:relative;width:36px;height:36px;border-radius:50%;background:conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c56bff,#ff6b6b);box-shadow:0 0 0 2px var(--line)}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border:2px solid var(--text);background:transparent;border-radius:999px;padding:9px 18px;font-weight:600;font-size:16px}
.btn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
:focus-visible{outline:3px solid hsl(var(--h) 80% 55%);outline-offset:3px}

.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:40px 0 14px;flex-wrap:wrap}
.gallery-head h2{font-size:28px;color:var(--text);margin:0;font-weight:600}
.gallery-head p{margin:2px 0 0;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:16px}
.g-item{border:0;background:transparent;border-radius:20px;padding:6px;aspect-ratio:1/1}
.g-item:hover{background:var(--bg)}
.g-item svg{width:100%;height:100%;overflow:visible}

/* ---------- karakter ---------- */
.ln{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.anim,.sq{transform-box:fill-box;transform-origin:50% 100%}
.eye{transform-box:fill-box;transform-origin:50% 50%;transition:transform .09s}
.blinking .eye{transform:scaleY(.08)}
.wave{transform-box:view-box;transform-origin:132px 110px;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}

.a-calm{animation:breathe 3.2s ease-in-out infinite}
.a-bounce{animation:hop .9s cubic-bezier(.3,.6,.4,1) infinite}
.a-shake{animation:shake .32s linear infinite}
.a-sag{animation:sag 4.6s ease-in-out infinite}
.a-sway{animation:sway 4s ease-in-out infinite}
.a-jump{animation:jump .55s cubic-bezier(.2,.8,.3,1.4) 1, breathe 3.2s ease-in-out .55s infinite}
.a-love{animation:love 1.6s ease-in-out infinite}
.a-wiggle{animation:wiggle 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}35%{transform:translateY(-12px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px) rotate(-1deg)}75%{transform:translateX(2.5px) rotate(1deg)}}
@keyframes sag{0%,100%{transform:scale(1.03,.96)}50%{transform:scale(1.06,.92)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes jump{0%{transform:scale(1.1,.85)}40%{transform:translateY(-22px) scale(.92,1.1)}100%{transform:translateY(0) scale(1)}}
@keyframes love{0%,100%{transform:scale(1)}15%{transform:scale(1.05,1.03)}30%{transform:scale(1)}45%{transform:scale(1.04,1.02)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.squish{animation:squish .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.18,.78)}60%{transform:scale(.92,1.1)}100%{transform:scale(1)}}

.dot{animation:think 1.5s ease-in-out infinite;opacity:.2}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes think{0%,100%{opacity:.2}40%{opacity:1}}
.tear{animation:tear 1.8s ease-in infinite;transform-box:fill-box}
.t2{animation-delay:.9s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.sweat{animation:sweat 2.4s ease-in-out infinite}
@keyframes sweat{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.float{transform-box:fill-box;transform-origin:center;animation:floaty 2s ease-in-out infinite}
@keyframes floaty{0%{transform:translateY(4px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}

/* galeri: lebih tenang */
.g-item .anim{animation:breathe 3.6s ease-in-out infinite}
.g-item .dot,.g-item .tear,.g-item .float,.g-item .pulse,.g-item .sweat{animation:none;opacity:1}
.g-item .float{opacity:0}

@media (prefers-reduced-motion:reduce){
  .anim,.anim *,.sq,.wave,#rig,#sqw{animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bolu</h1>
    <p>Blob kecil warna-warni dengan banyak suasana hati. Matanya ikut kursor, klik untuk mencubit.</p>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="shadow"></div>
      <div id="holder"><div id="sqw"><div id="rig"><canvas id="fur"></canvas><div id="svgwrap"></div></div></div></div>
      <div class="caption" id="caption" aria-live="polite"></div>
    </div>

    <div class="panel">
      <section><h2>Ekspresi</h2><div class="chips" id="exprs"></div></section>
      <section><h2>Bentuk</h2><div class="shapes" id="shapes"></div></section>
      <section>
        <h2>Warna</h2>
        <div class="swatches" id="swatches">
          <label class="picker" title="Warna bebas"><input type="color" id="custom" value="#f28c4e" aria-label="Pilih warna bebas"></label>
        </div>
      </section>
      <section id="furctl" hidden>
        <h2>Bulu</h2>
        <label class="slider">Panjang <input type="range" id="furlen" min="0.02" max="0.16" step="0.005" value="0.085"></label>
        <label class="slider">Kerapatan <input type="range" id="furdens" min="0.6" max="2.4" step="0.1" value="1.7"></label>
      </section>
      <div class="row">
        <button class="btn" id="mode3d" aria-pressed="false">3D berbulu</button>
        <button class="btn" id="feet" aria-pressed="true">Kaki mungil</button>
        <button class="btn" id="rainbow" aria-pressed="false">Mode pelangi</button>
        <button class="btn" id="random">Acak semua</button>
      </div>
      <p class="hint">Tombol angka 1–9 dan 0 untuk ganti ekspresi cepat. Klik Bolu untuk mengelusnya.</p>
    </div>
  </main>

  <div class="gallery-head">
    <div><h2>Keluarga Bolu</h2><p>Klik salah satu untuk memainkannya di atas.</p></div>
    <button class="btn" id="shuffle">Kocok ulang</button>
  </div>
  <div class="gallery" id="gallery"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= Bentuk tubuh (viewBox 200×200) ================= */
function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+' '+(cy+rad*Math.sin(a)).toFixed(1)+' '}return p+'Z'}

const SHAPES = {
  kacang:  {label:'Kacang', sw:4, foot:168, face:[100,104,1.1],  d:'<path d="M60 50 C100 30 160 40 165 90 C170 140 140 170 95 168 C50 166 28 140 32 100 C34 75 40 60 60 50 Z"/>'},
  hantu:   {label:'Hantu',  sw:6, foot:null, face:[98,86,1],      d:'<path d="M90 30 C130 26 150 60 146 100 C143 126 154 142 162 156 Q172 174 152 174 C130 174 112 168 100 160 C70 168 52 140 52 104 C52 60 60 34 90 30 Z"/>'},
  gumpal:  {label:'Gumpal', sw:4, foot:166, face:[100,100,1.15], d:'<path d="M50 52 C80 36 130 38 158 52 C176 70 172 130 160 152 C140 172 70 174 46 154 C30 130 30 72 50 52 Z"/>'},
  awan:    {label:'Awan',   sw:4, foot:162, face:[102,116,1.05], d:'<path d="M50 162 Q20 162 22 132 Q24 106 50 102 Q50 64 88 60 Q112 36 140 58 Q176 60 172 100 Q190 114 182 140 Q176 164 150 162 Z"/>'},
  daun:    {label:'Daun',   sw:4, foot:null, face:[98,98,1.05],   d:'<path d="M40 60 C70 46 150 50 166 66 C176 80 150 140 110 158 C80 170 46 160 38 130 C30 100 26 70 40 60 Z"/>'},
  percik:  {label:'Percik', sw:4, foot:null, face:[104,108,1],    d:'<path d="M60 60 C90 40 120 70 150 58 C176 50 178 90 164 110 C152 130 172 150 150 162 C120 176 100 150 72 162 C44 172 28 140 40 116 C50 96 36 76 60 60 Z"/>'},
  bintang: {label:'Bintang',sw:36,foot:null, face:[100,112,.95],  d:`<path d="${starPath(100,110,66,40)}"/>`},
  genangan:{label:'Genangan',sw:4,foot:null, face:[104,128,.9],   d:'<path d="M30 140 C24 110 50 104 70 112 C90 120 100 80 130 82 C160 84 178 110 172 140 C168 164 130 166 100 162 C70 160 34 168 30 140 Z"/>'},
  melambai:{label:'Melambai',sw:4,foot:172, face:[100,96,.9],    d:'<rect x="64" y="46" width="72" height="126" rx="36"/><path class="wave" d="M132 110 Q152 98 158 74" fill="none" stroke-width="16" stroke-linecap="round"/><path d="M68 122 Q54 134 52 148" fill="none" stroke-width="14" stroke-linecap="round"/>'},
  tetes:   {label:'Tetes',  sw:6, foot:172, face:[100,126,1.05], d:'<path d="M88 42 Q100 22 112 42 Q150 92 160 120 Q166 172 100 172 Q34 172 40 120 Q50 92 88 42 Z"/>'},
  mochi:   {label:'Mochi',  sw:4, foot:172, face:[100,124,1.1],  d:'<path d="M28 142 Q24 72 100 68 Q176 72 172 142 Q172 172 100 172 Q28 172 28 142 Z"/>'},
  bulat:   {label:'Bulat',  sw:4, foot:174, face:[100,104,1.15], d:'<circle cx="100" cy="106" r="68"/>'},
  kotak:   {label:'Kotak',  sw:4, foot:172, face:[100,106,1.2],  d:'<rect x="34" y="40" width="132" height="132" rx="30"/>'},
  segitiga:{label:'Segitiga',sw:40,foot:170, face:[100,124,.85], d:'<path d="M100 52 L154 152 L46 152 Z"/>'},
  hati:    {label:'Hati',   sw:6, foot:null, face:[100,104,.95],  d:'<path d="M108 162 Q100 170 92 162 C40 128 18 98 32 70 C46 42 84 44 100 72 C116 44 154 42 168 70 C182 98 160 128 108 162 Z"/>'},
  kucing:  {label:'Kucing', sw:6, foot:176, face:[100,114,1.05], d:'<path d="M46 80 Q40 36 52 30 Q62 26 92 52 Z M154 80 Q160 36 148 30 Q138 26 108 52 Z"/><circle cx="100" cy="112" r="64"/>'},
};

/* ================= Komponen wajah (pusat wajah = 0,0) ================= */
let uid=0, clipsBuf='';
function eye(cx,{rx=10.5,ry=11.5,lid=null,pr=7}={}){
  let clip='',line='';
  if(lid){
    const s=Math.sign(cx),ox=cx+s*(rx+2),ix=cx-s*(rx+2),id='c'+(uid++);
    clipsBuf+=`<clipPath id="${id}"><polygon points="${ox},${lid[0]} ${ix},${lid[1]} ${ix},20 ${ox},20"/></clipPath>`;
    clip=`clip-path="url(#${id})"`;
    line=`<path d="M${ox} ${lid[0]} L${ix} ${lid[1]}" class="ln" stroke-width="4"/>`;
  }
  return `<g class="eye"><g ${clip}><ellipse cx="${cx}" cy="-8" rx="${rx}" ry="${ry}" fill="#fff"/>
    <g class="look"><circle cx="${cx}" cy="-7" r="${pr}" fill="#1E1B2E"/><circle cx="${cx+pr*.4}" cy="${-7-pr*.45}" r="${pr*.42}" fill="#fff"/><circle cx="${cx-pr*.42}" cy="${-7+pr*.4}" r="${pr*.2}" fill="#fff"/></g></g>${line}</g>`;
}
const heart=(cx)=>`<g class="eye"><g class="look"><g class="pulse"><path fill="#ff3d6e" d="M${cx} 0 C${cx-11} -7 ${cx-10} -17 ${cx-4} -16 C${cx-1.5} -15 ${cx} -13 ${cx} -11.5 C${cx} -13 ${cx+1.5} -15 ${cx+4} -16 C${cx+10} -17 ${cx+11} -7 ${cx} 0 Z"/></g></g></g>`;
const tear=(cx,cls)=>`<path class="tear ${cls}" fill="#9ad8ff" d="M${cx} 4 Q${cx+4} 10 ${cx+4} 13 A4 4 0 0 1 ${cx-4} 13 Q${cx-4} 10 ${cx} 4 Z"/>`;


const EXPR = {
  senang:{label:'Senang',say:'lagi senang',anim:'bounce',blink:false,blush:.75,f:()=>`
    <g class="look"><path d="M-25 -5 Q-17 -16 -9 -5 M9 -5 Q17 -16 25 -5" class="ln" stroke-width="5"/></g>
    <path d="M-12 9 Q0 11 12 9 Q10 26 0 26 Q-10 26 -12 9 Z" fill="var(--ink)"/>
    <path d="M-6 22 Q0 17 6 22 Q3 25.5 0 25.5 Q-3 25.5 -6 22 Z" fill="#ff7d93"/>`},
  iseng:{label:'Iseng',say:'lagi iseng',anim:'wiggle',blink:false,f:()=>`
    ${eye(-17)}<path d="M9 -7 Q17 -14 25 -7" class="ln" stroke-width="5"/>
    <ellipse cx="5" cy="18" rx="4.5" ry="5.5" fill="#ff7d93"/>
    <path d="M-10 11 Q0 20 10 11" class="ln" stroke-width="4.5"/>`},
  bosan:{label:'Bosan',say:'lagi bosan…',anim:'sway',blink:true,look:[-3,1.5],f:()=>`
    ${eye(-17,{lid:[-8,-8]})}${eye(17,{lid:[-8,-8]})}
    <path d="M-9 18 L7 16" class="ln" stroke-width="4.5"/>`},
  mikir:{label:'Mikir',say:'lagi mikir',anim:'calm',blink:true,look:[3,-3.5],f:()=>`
    ${eye(-17)}${eye(17)}
    <path d="M-26 -25 L-10 -23" class="ln" stroke-width="4.5"/><path d="M9 -28 Q17 -34 26 -28" class="ln" stroke-width="4.5"/>
    <path d="M-4 18 Q0 15 4 18 Q8 21 12 18" class="ln" stroke-width="4.5"/>
    <g fill="var(--ink)"><circle class="dot" cx="38" cy="-40" r="3.5"/><circle class="dot d2" cx="48" cy="-52" r="4.5"/><circle class="dot d3" cx="61" cy="-65" r="6"/></g>`},
  marah:{label:'Marah',say:'lagi marah!',anim:'shake',blink:false,f:()=>`
    ${eye(-17,{lid:[-15,-5]})}${eye(17,{lid:[-15,-5]})}
    <path d="M-29 -23 L-8 -14 M29 -23 L8 -14" class="ln" stroke-width="5"/>
    <rect x="-12" y="13" width="24" height="10" rx="4" fill="#fff" stroke="var(--ink)" stroke-width="3.5"/>
    <path d="M-10 18 L10 18 M-4 13 L-4 23 M4 13 L4 23" stroke="var(--ink)" stroke-width="2"/>
    <g transform="translate(42 -44)"><g class="pulse"><path d="M-10 -3 Q-3 -3 -3 -10 M3 -10 Q3 -3 10 -3 M10 3 Q3 3 3 10 M-3 10 Q-3 3 -10 3" stroke="#ff3d4f" stroke-width="4" fill="none" stroke-linecap="round"/></g></g>`},
  capek:{label:'Capek',say:'capek banget',anim:'sag',blink:true,look:[0,2],f:()=>`
    ${eye(-17,{lid:[-2,-11]})}${eye(17,{lid:[-2,-11]})}
    <ellipse cx="0" cy="19" rx="5" ry="3.5" fill="var(--ink)"/>
    <path class="sweat" fill="#9ad8ff" d="M36 -40 Q43 -30 43 -26 A7 7 0 0 1 29 -26 Q29 -30 36 -40 Z"/>`},
  kaget:{label:'Kaget',say:'kaget!',anim:'jump',blink:false,f:()=>`
    ${eye(-17,{rx:12,ry:13,pr:3.5})}${eye(17,{rx:12,ry:13,pr:3.5})}
    <ellipse cx="0" cy="20" rx="6" ry="8" fill="var(--ink)"/>
    <path d="M-36 -38 L-42 -48 M0 -44 L0 -56 M36 -38 L42 -48" class="ln" stroke-width="4.5"/>`},
  sedih:{label:'Sedih',say:'lagi sedih',anim:'calm',blink:true,look:[0,2.5],f:()=>`
    ${eye(-17)}${eye(17)}
    <path d="M-27 -20 L-11 -26 M27 -20 L11 -26" class="ln" stroke-width="4.5"/>
    <path d="M-9 22 Q0 14 9 22" class="ln" stroke-width="4.5"/>${tear(-20,'')}${tear(20,'t2')}`},
  gemas:{label:'Gemas',say:'lagi gemas >w<',anim:'wiggle',blink:false,blush:.95,f:()=>`
    <g class="look"><path d="M-25 -15 L-12 -7.5 L-25 0 M25 -15 L12 -7.5 L25 0" class="ln" stroke-width="5"/></g>
    <path d="M-9 13 Q-4.5 19 0 13 Q4.5 19 9 13" class="ln" stroke-width="4"/>`},
  cinta:{label:'Jatuh cinta',say:'lagi jatuh cinta',anim:'love',blink:false,blush:.85,f:()=>`
    ${heart(-17)}${heart(17)}
    <path d="M-9 12 Q0 20 9 12" class="ln" stroke-width="4.5"/>
    <path class="float" fill="#ff3d6e" d="M44 -38 C37 -42 38 -49 41 -48 C43 -48 44 -46 44 -45 C44 -46 45 -48 47 -48 C50 -49 51 -42 44 -38 Z"/>`},
};

const SWATCHES=['#F28C4E','#2E9BEF','#A77DC9','#4DBB72','#F59ABF','#B8D435','#E0389A','#FFCD2E','#F2645A','#1BB4C8','#7CCBF2','#8B6FD6'];

/* ================= Util warna ================= */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return [h,s*100,l*100];
}
const inkFor=l=>l<32?'#FFF6EA':'#1E1B2E';

/* ================= Builder karakter ================= */
function footPath(y){y-=3;return `<path d="M70 ${y} a12 8 0 1 0 24 0 a12 8 0 1 0 -24 0 Z M106 ${y} a12 8 0 1 0 24 0 a12 8 0 1 0 -24 0 Z"/>`}
function shapeD(sk,feet){const sh=SHAPES[sk];return (feet&&sh.foot?footPath(sh.foot):'')+sh.d}
function charSVG(sk,ek,color,main){
  const sh=SHAPES[sk],ex=EXPR[ek];clipsBuf='';const face=ex.f(),cg='rg'+(uid++);
  const [hh,ss,l]=hexToHsl(color),[fx,fy0,fs]=sh.face,fy=fy0+3;
  const feetG=st.feet&&sh.foot?`<g class="feet" fill="hsl(${hh.toFixed(0)} ${ss.toFixed(0)}% ${Math.max(l-12,8).toFixed(0)}%)">${footPath(sh.foot)}</g>`:'';
  clipsBuf+=`<radialGradient id="${cg}"><stop offset="0" stop-color="#ff5a86" stop-opacity="${ex.blush||.55}"/><stop offset="1" stop-color="#ff5a86" stop-opacity="0"/></radialGradient>`;
  const blush=`<ellipse cx="-31" cy="9" rx="11" ry="7" fill="url(#${cg})"/><ellipse cx="31" cy="9" rx="11" ry="7" fill="url(#${cg})"/>`;
  return `<svg viewBox="0 0 200 200" class="char" data-expr="${ek}" style="--ink:${inkFor(l)};--cheek:rgba(255,80,120,.4)" ${main?'role="img" aria-label="Karakter Bolu"':'aria-hidden="true"'}>
    <defs>${clipsBuf}</defs>
    <g class="sq"><g class="anim ${main?'a-'+ex.anim:''}">
      ${feetG}<g class="body" fill="${color}" stroke="${color}" stroke-width="${sh.sw}" stroke-linejoin="round">${sh.d}</g>
      <g class="face" transform="translate(${fx} ${fy}) scale(${fs})">${blush}${face}</g>
    </g></g></svg>`;
}

/* ================= State & render ================= */
const st={shape:'kacang',expr:'senang',color:'#F28C4E',rainbow:false,hue:24,is3d:false,feet:true,tmp:null};
const $=id=>document.getElementById(id);

function render(){
  const ek=st.tmp||st.expr,ex=EXPR[ek];
  $('svgwrap').innerHTML=charSVG(st.shape,ek,st.color,true);
  if(st.is3d){
    $('svgwrap').querySelector('.anim').classList.remove('a-'+ex.anim);
    $('rig').className='a-'+ex.anim;
    fur.setShape(st.shape,st.feet);fur.setColor(st.rainbow?`hsl(${st.hue.toFixed(1)} 78% 62%)`:st.color);
  } else $('rig').className='';
  $('caption').textContent=`Bolu ${ex.say}`;
  document.querySelectorAll('[data-e]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.e===st.expr));
  document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st.shape));
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',!st.rainbow&&b.dataset.c.toLowerCase()===st.color.toLowerCase()));
  document.documentElement.style.setProperty('--h',Math.round(hexToHsl(st.color)[0]));
  $('svgwrap').querySelector('svg').addEventListener('click',squish);
}
let tmpTimer;
function squish(e){
  st.tmp=st.expr==='gemas'?'senang':'gemas';render();
  clearTimeout(tmpTimer);tmpTimer=setTimeout(()=>{st.tmp=null;render()},1200);
  const s=st.is3d?$('sqw'):$('svgwrap').querySelector('.sq');
  s.classList.remove('squish');void s.getBoundingClientRect();s.classList.add('squish');
  const stage=$('stage'),r=stage.getBoundingClientRect();
  const x0=e?e.clientX-r.left:r.width/2,y0=e?e.clientY-r.top:r.height/2;
  for(let i=0;i<5;i++){
    const h=document.createElement('span');h.className='pat';
    h.innerHTML=i%2?'<svg viewBox="0 0 20 20"><path d="M10 0 L12.5 7.5 L20 10 L12.5 12.5 L10 20 L7.5 12.5 L0 10 L7.5 7.5 Z" fill="#FFD23F"/></svg>'
      :'<svg viewBox="0 0 20 18"><path d="M10 18 C-6 8 1 -4 10 4 C19 -4 26 8 10 18 Z" fill="#ff4d7d"/></svg>';
    h.style.left=x0+'px';h.style.top=y0+'px';
    h.style.setProperty('--dx',(Math.random()*120-60)+'px');h.style.setProperty('--dy',(-60-Math.random()*80)+'px');
    h.style.setProperty('--s',(.7+Math.random()*.7).toFixed(2));h.style.animationDelay=(i*50)+'ms';
    stage.append(h);setTimeout(()=>h.remove(),1300);
  }
}

/* ================= Kontrol ================= */
Object.entries(EXPR).forEach(([k,v],i)=>{
  const b=document.createElement('button');b.className='chip';b.dataset.e=k;
  b.innerHTML=`${v.label}<kbd>${(i+1)%10}</kbd>`;b.onclick=()=>{st.expr=k;render()};$('exprs').append(b);
});
Object.entries(SHAPES).forEach(([k,v])=>{
  const b=document.createElement('button');b.className='shape-btn';b.dataset.s=k;
  b.innerHTML=`<svg viewBox="16 18 168 168" aria-hidden="true"><g fill="currentColor" stroke="currentColor" stroke-width="${v.sw}" stroke-linejoin="round">${v.d.replace('class="wave"','')}</g></svg>${v.label}`;
  b.onclick=()=>{st.shape=k;render()};$('shapes').append(b);
});
SWATCHES.forEach(c=>{
  const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;
  b.setAttribute('aria-label','Warna '+c);b.onclick=()=>{stopRainbow();st.color=c;render()};
  $('swatches').insertBefore(b,$('swatches').lastElementChild);
});
$('custom').oninput=e=>{stopRainbow();st.color=e.target.value;render()};
function stopRainbow(){st.rainbow=false;$('rainbow').setAttribute('aria-pressed','false')}
$('rainbow').onclick=()=>{st.rainbow=!st.rainbow;$('rainbow').setAttribute('aria-pressed',st.rainbow);
  st.hue=hexToHsl(st.color)[0];if(!st.rainbow)render();else document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed','false'))};
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('random').onclick=()=>{stopRainbow();st.shape=pick(Object.keys(SHAPES));st.expr=pick(Object.keys(EXPR));st.color=pick(SWATCHES);render()};
const ekeys=Object.keys(EXPR);
addEventListener('keydown',e=>{const n=e.key==='0'?10:parseInt(e.key);if(n>=1&&n<=ekeys.length&&!e.target.matches('input')){st.expr=ekeys[n-1];render()}});

/* ================= Galeri ================= */
function shuffleGallery(){
  const shapes=Object.keys(SHAPES).sort(()=>Math.random()-.5).slice(0,12);
  const cols=[...SWATCHES].sort(()=>Math.random()-.5);
  $('gallery').innerHTML='';
  shapes.forEach((s,i)=>{
    const c=cols[i%cols.length],e=pick(ekeys);
    const b=document.createElement('button');b.className='g-item';
    b.setAttribute('aria-label',`${SHAPES[s].label}, ${EXPR[e].label}`);
    b.innerHTML=charSVG(s,e,c,false);
    b.onclick=()=>{stopRainbow();Object.assign(st,{shape:s,expr:e,color:c});render();
      $('holder').scrollIntoView({behavior:'smooth',block:'center'})};
    $('gallery').append(b);
  });
}
$('shuffle').onclick=shuffleGallery;

/* ================= Mata ikut kursor, kedip, pelangi ================= */
let px=-1,py=-1;
let lastMove=0,wander=[0,0],nextW=0;
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;lastMove=performance.now()});
const isIdle=()=>performance.now()-lastMove>2600;
function wanderOf(o){const now=performance.now();if(!o._nw||now>o._nw){o._w=[Math.random()*2-1,Math.random()*1.4-.7];o._nw=now+900+Math.random()*2200}return o._w}
function loop(){
  document.querySelectorAll('svg.char').forEach(svg=>{
    const ex=EXPR[svg.dataset.expr];let t=[0,0];
    if(ex.look)t=ex.look;
    else if(isIdle()){const w=wanderOf(svg);t=[w[0]*3.5,w[1]*3]}
    else if(px>=0){const r=svg.getBoundingClientRect();
      const nx=(px-(r.left+r.width/2))/(r.width/1.2),ny=(py-(r.top+r.height/2))/(r.height/1.2);
      t=[Math.max(-1,Math.min(1,nx))*3.5,Math.max(-1,Math.min(1,ny))*3]}
    const c=svg._c||(svg._c=[0,0]);c[0]+=(t[0]-c[0])*.15;c[1]+=(t[1]-c[1])*.15;
    svg.querySelectorAll('.look').forEach(el=>el.setAttribute('transform',`translate(${c[0].toFixed(2)} ${c[1].toFixed(2)})`));
  });
  if(st.rainbow){
    st.hue=(st.hue+.6)%360;const col=`hsl(${st.hue.toFixed(1)} 78% 62%)`;
    const b=$('svgwrap').querySelector('.body');if(b){b.setAttribute('fill',col);b.setAttribute('stroke',col)}
    const ft=$('svgwrap').querySelector('.feet');if(ft)ft.setAttribute('fill',`hsl(${st.hue.toFixed(1)} 70% 50%)`);
    if(st.is3d)fur.setColor(col);
    document.documentElement.style.setProperty('--h',Math.round(st.hue));
  }
  if(st.is3d)fur.frame();
  requestAnimationFrame(loop);
}
function blink(){
  document.querySelectorAll('svg.char').forEach(svg=>{
    if(EXPR[svg.dataset.expr].blink&&Math.random()<.4){
      const f=svg.querySelector('.face');setTimeout(()=>{f.classList.add('blinking');setTimeout(()=>f.classList.remove('blinking'),140)},Math.random()*600)}
  });
  setTimeout(blink,1600+Math.random()*2200);
}

/* ================= Mode 3D berbulu (Three.js, shell texturing) ================= */
const fur = (()=>{
  let R,scene,cam,group,shared,mats=[],meshes=[],cache={},cur=null,rot=[0,0],zFace=0,t0=performance.now();
  const LAYERS=44,N=150;

  const VS=`uniform float uLayer,uLen,uTime,uDens;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      float l2=uLayer*uLayer;
      vec3 p=position+normal*uLen*uLayer;
      p.x+=sin(uTime*1.7+position.y*5.0)*0.014*l2;
      p.y+=cos(uTime*1.3+position.x*5.0)*0.008*l2-0.03*l2*uLen*8.0;
      vUv=position.xy*uDens+vec2(position.z*0.7);
      vN=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`;
  const FS=`uniform float uLayer; uniform vec3 uColor; uniform sampler2D uNoise;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      float n=texture2D(uNoise,vUv).r;
      if(uLayer>0.0 && n<0.08+uLayer*0.92) discard;
      vec3 N=normalize(vN), L=normalize(vec3(-0.45,0.6,0.75));
      float diff=max(dot(N,L),0.0);
      float spec=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.0),12.0)*0.12*uLayer;
      float rim=pow(1.0-max(N.z,0.0),2.5)*0.35*uLayer;
      float ao=0.58+0.42*pow(uLayer,0.6);
      vec3 c=uColor*(0.7+0.45*diff)*ao;
      c=mix(c,vec3(1.0),0.22*uLayer*uLayer)+vec3(spec+rim);
      gl_FragColor=vec4(c,1.0);
    }`;

  function init(){
    if(!window.THREE) throw new Error('three');
    const canvas=$('fur');
    R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    R.setPixelRatio(Math.min(devicePixelRatio,2));
    scene=new THREE.Scene();
    cam=new THREE.OrthographicCamera(-1.2,1.2,1.2,-1.2,-10,10);cam.position.z=5;
    group=new THREE.Group();scene.add(group);
    const S=256,data=new Uint8Array(S*S*4);
    for(let i=0;i<S*S;i++){const v=Math.random()*255;data[i*4]=data[i*4+1]=data[i*4+2]=v;data[i*4+3]=255}
    const tex=new THREE.DataTexture(data,S,S,THREE.RGBAFormat);
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.needsUpdate=true;
    shared={uColor:{value:new THREE.Color(st.color)},uLen:{value:+$('furlen').value},uDens:{value:+$('furdens').value},uTime:{value:0},uNoise:{value:tex}};
    for(let k=0;k<LAYERS;k++){
      mats.push(new THREE.ShaderMaterial({uniforms:{...shared,uLayer:{value:k/(LAYERS-1)}},vertexShader:VS,fragmentShader:FS}));
    }
    new ResizeObserver(size).observe($('holder'));size();
  }
  function size(){const r=$('fur').getBoundingClientRect();if(r.width)R.setSize(r.width,r.height,false)}

  function roundRect(p,x,y,w,h,r){r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath()}

  // gambar bentuk 2D -> mask -> peta jarak -> tinggi "mengembang" -> mesh depan+belakang
  function build(sk,feet){
    const sh=SHAPES[sk],cv=document.createElement('canvas');cv.width=cv.height=N;
    const ctx=cv.getContext('2d');ctx.scale(N/200,N/200);ctx.fillStyle=ctx.strokeStyle='#fff';ctx.lineJoin=ctx.lineCap='round';
    const doc=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${shapeD(sk,feet)}</svg>`,'image/svg+xml');
    for(const el of doc.documentElement.children){
      const g=n=>+el.getAttribute(n);let p=new Path2D();
      if(el.tagName==='circle')p.arc(g('cx'),g('cy'),g('r'),0,Math.PI*2);
      else if(el.tagName==='rect')roundRect(p,g('x'),g('y'),g('width'),g('height'),g('rx')||0);
      else p=new Path2D(el.getAttribute('d'));
      ctx.lineWidth=+(el.getAttribute('stroke-width')||sh.sw);
      if(el.getAttribute('fill')!=='none')ctx.fill(p);ctx.stroke(p);
    }
    const a=ctx.getImageData(0,0,N,N).data,inside=new Uint8Array(N*N),D=new Float32Array(N*N);
    for(let i=0;i<N*N;i++){inside[i]=a[i*4+3]>127;D[i]=inside[i]?1e9:0}
    const at=(x,y)=>(x<0||y<0||x>=N||y>=N)?0:D[y*N+x];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(!D[i])continue;
      D[i]=Math.min(D[i],at(x-1,y)+1,at(x,y-1)+1,at(x-1,y-1)+1.414,at(x+1,y-1)+1.414)}
    for(let y=N-1;y>=0;y--)for(let x=N-1;x>=0;x--){const i=y*N+x;if(!D[i])continue;
      D[i]=Math.min(D[i],at(x+1,y)+1,at(x,y+1)+1,at(x+1,y+1)+1.414,at(x-1,y+1)+1.414)}
    let dmax=0;for(let i=0;i<N*N;i++)dmax=Math.max(dmax,D[i]);
    const w=2/N,dk=dmax*w;
    let Z=new Float32Array(N*N);
    for(let i=0;i<N*N;i++)if(inside[i]){const d=Math.min(D[i]*w,dk);Z[i]=Math.sqrt(Math.max(0,dk*dk-(dk-d)*(dk-d)))*0.85}
    // haluskan punggungan
    for(let it=0;it<5;it++){const Z2=Z.slice();
      for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;if(!inside[i])continue;
        Z2[i]=(Z[i]*4+Z[i-1]+Z[i+1]+Z[i-N]+Z[i+N])/8}Z=Z2}
    const valid=new Uint8Array(N*N);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;
      valid[i]=inside[i]||(x>0&&inside[i-1])||(x<N-1&&inside[i+1])||(y>0&&inside[i-N])||(y<N-1&&inside[i+N])}
    const pos=[],idxF=new Int32Array(N*N).fill(-1),idxB=new Int32Array(N*N).fill(-1);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(!valid[i])continue;
      const X=(x+.5)/N*2-1,Y=-((y+.5)/N*2-1),z=inside[i]?Z[i]:0;
      idxF[i]=pos.length/3;pos.push(X,Y,z);if(inside[i]){idxB[i]=pos.length/3;pos.push(X,Y,-z)}else idxB[i]=idxF[i]}
    const ind=[];
    for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){
      const A=y*N+x,B=A+1,C=A+N,Dd=C+1;
      if(!(valid[A]&&valid[B]&&valid[C]&&valid[Dd]))continue;
      if(!(inside[A]||inside[B]||inside[C]||inside[Dd]))continue;
      ind.push(idxF[A],idxF[C],idxF[B],idxF[B],idxF[C],idxF[Dd]);
      ind.push(idxB[A],idxB[B],idxB[C],idxB[B],idxB[Dd],idxB[C]);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geo.setIndex(ind);geo.computeVertexNormals();
    const [fx,fy]=sh.face,fi=Math.min(N-1,Math.floor((fy-6)/200*N))*N+Math.min(N-1,Math.floor(fx/200*N));
    return {geo,zFace:Z[fi]||0.4};
  }

  return {
    ok:()=>!!R,
    start(){if(!R)init()},
    setShape(sk,feet){
      const key=sk+(feet?'+f':'');if(cur===key)return;cur=key;
      const c=cache[key]||(cache[key]=build(sk,feet));zFace=c.zFace;
      meshes.forEach(m=>group.remove(m));
      meshes=mats.map((m,k)=>{const me=new THREE.Mesh(c.geo,m);me.renderOrder=k;group.add(me);return me});
    },
    setColor(c){shared.uColor.value.set(c)},
    setLen(v){shared.uLen.value=v},
    setDens(v){shared.uDens.value=v},
    frame(){
      shared.uTime.value=(performance.now()-t0)/1000;
      let tx=0,ty=0;
      if(isIdle()){const w=wanderOf(fur);tx=w[0]*.3;ty=w[1]*.25}
      else if(px>=0){const r=$('holder').getBoundingClientRect();
        tx=Math.max(-1,Math.min(1,(px-(r.left+r.width/2))/r.width))*0.55;
        ty=Math.max(-1,Math.min(1,(py-(r.top+r.height/2))/r.height))*0.35}
      rot[0]+=(ty-rot[0])*.08;rot[1]+=(tx-rot[1])*.08;
      group.rotation.set(rot[0],rot[1],0);
      const W=$('holder').clientWidth/2;
      $('svgwrap').style.transform=`translate(${(Math.sin(rot[1])*zFace*W).toFixed(1)}px,${(Math.sin(rot[0])*zFace*W).toFixed(1)}px)`;
      R.render(scene,cam);
    }
  };
})();

$('mode3d').onclick=()=>{
  if(!st.is3d){
    try{fur.start()}catch(e){
      if(!$('err3d')){const p=document.createElement('p');p.id='err3d';p.className='err';
        p.textContent='Mode 3D butuh WebGL dan pustaka Three.js. Coba muat ulang halaman atau pakai browser lain.';
        $('mode3d').parentElement.after(p)}
      return}
  }
  st.is3d=!st.is3d;
  $('mode3d').setAttribute('aria-pressed',st.is3d);
  $('holder').classList.toggle('is3d',st.is3d);
  $('furctl').hidden=!st.is3d;
  if(!st.is3d)$('svgwrap').style.transform='';
  render();
  if(st.rainbow)fur.setColor(`hsl(${st.hue.toFixed(1)} 78% 62%)`);
};
$('feet').onclick=()=>{st.feet=!st.feet;$('feet').setAttribute('aria-pressed',st.feet);render();shuffleGallery()};
$('furlen').oninput=e=>fur.setLen(+e.target.value);
$('furdens').oninput=e=>fur.setDens(+e.target.value);

render();shuffleGallery();loop();setTimeout(blink,1500);
</script>
