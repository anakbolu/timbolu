name: Deployment

# A push to `main` redeploys the services the commit touched, by calling each service's Easypanel
# deploy webhook (`/api/deploy/<token>`). There are no tests here on purpose: the quality gates are a
# separate concern, and this workflow owns one thing — turning "these paths changed" into "the
# services that build from those paths are redeployed".
#
# The mapping is path -> service. Every Go service builds from the repository root, because each
# module imports the shared `packages/` module and a Docker build does not read `go.work`, so what a
# service is configured with in Easypanel is:
#
#   service                      source path      Dockerfile                    build arg
#   timbolu                      /apps/frontend   Dockerfile                    —
#   timbolu-backend              /                apps/backend/Dockerfile       BINARY=api
#   timbolu-agent-worker         /                apps/backend/Dockerfile       BINARY=agent-worker
#   timbolu-integration-worker   /                apps/backend/Dockerfile       BINARY=integration-worker
#   timbolu-wa-gateway           /                apps/whatsapp-gw/Dockerfile   —
#   timbolu-migrate              /                apps/backend/Dockerfile       BINARY=../tools/migrate
#
# Which paths therefore redeploy which service:
#
#   apps/frontend/**            -> timbolu                     (the web app)
#   apps/backend/**             -> timbolu-backend             (the API)
#                                  timbolu-agent-worker        (the agent queue)
#                                  timbolu-integration-worker  (the integration queue)
#   apps/backend-js/**          -> timbolu-backend             (the API, Bun port)
#                                  timbolu-agent-worker        (the agent queue, Bun port)
#                                  timbolu-integration-worker  (the integration queue, Bun port)
#   apps/whatsapp-gw/**         -> timbolu-wa-gateway          (the WhatsApp gateway)
#   apps/backend/migrations/**  -> timbolu-migrate             (the schema, applied first)
#   root build files           -> every service above          (see below)
#   .github/workflows/**        -> every service above          (this workflow decides what ships)
#
# The gateway is its own module and its own image, so it is triggered by its own path rather than by
# `apps/backend/**`. `packages/` is two things: the Go module both Go services import, and TypeScript
# packages that belong to the web app. Only the Go half enters a Go image — the backend's build
# fingerprint hashes `*.go` and nothing else (apps/backend/Dockerfile) — so the Go triggers match the
# module's `.go` files and its manifests, not `packages/**`. A TypeScript-only change there is not a
# change to either Go image, and the `timbolu` image builds from `apps/frontend` alone (#330 kept the
# stream's event names local so it would build without `packages/`), so such a change rolls nothing.
# When the web app starts consuming a package at build time, that package's path goes in the
# `frontend` filter, where the image that would rebuild is named. A `packages/**` here again would
# roll four Go services for a change none of them builds.
#
# `apps/backend-js/**` is the second implementation of those same three backend services: the Bun
# port, which `apps/backend-js/Dockerfile` builds into one image and selects with `APP=api`,
# `APP=agent-worker` or `APP=integration-worker`. It is not an optional path. The implementation
# that actually serves production today is that Bun port (#350), so a commit that only touches
# `apps/backend-js/**` changes the code users run — before this filter existed it matched nothing,
# every deploy job was skipped and the run went green, the same hole as #322/#345. The Bun tree
# shares no build input with the Go one: its Dockerfile copies `apps/backend-js/package.json`,
# `apps/backend-js/tsconfig.json`, `apps/backend-js/bun.lock` and `apps/backend-js/src`, and nothing
# from `packages/`, so `packages/**` stays out of this filter for the same reason it is out of the
# gateway's.
#
# The root build files are `.dockerignore`, `Makefile`, `go.work`, `go.work.sum`, and
# `docker-compose*.yml`. They belong to no app, so before this filter existed a commit touching only
# one of them matched nothing and the run went green with every deploy job skipped. They shape every
# image: `.dockerignore` decides what enters every build context (a wrong line there is what broke
# the gateway build, #316), `go.work`/`go.work.sum` are how the modules are wired for local and CI
# work, `Makefile` is the same commands, and the compose files run the same images locally. A change
# to any of them therefore redeploys every service, exactly like a change to the Go module under
# `packages/` does for the Go ones.
#
# `.github/workflows/**` is on the same list for the same reason, from the other direction: this
# workflow is what turns a commit into a deploy, so a commit that only edits it matched no app path,
# every job was skipped, and the edit was never exercised. That is exactly how the `verify` job added
# in #324 spent its first twelve hours never having run at all, while production kept serving an
# image from before the commit that added it (#322). A change here redeploys every service, which
# costs one full rollout and buys the only thing that can prove a workflow edit works: a run of it.
#
# The patterns have no leading `/`: `dorny/paths-filter` matches with picomatch, where a leading
# slash is a literal character that a repository-relative path never has. A bare name still matches
# the root only, because the pattern contains no `/` to match at another depth.
#
# `timbolu-temporal` and `timbolu-temporal-ui` are upstream images with no path in this repository, so
# nothing here triggers them.
#
# The migration is applied before anything else rolls out, and both the backend services and the
# frontend wait for it: a rollout that starts a new image before the schema matches it is an outage
# for as long as the migration takes. That ordering is why `migrate` is its own job rather than one
# more entry in the backend matrix.
#
# What each service needs, once — repository secrets, see docs/deployment.md:
#
#   TIMBOLU_FRONTEND_DEPLOY_HOOK, TIMBOLU_BACKEND_DEPLOY_HOOK, TIMBOLU_AGENT_WORKER_DEPLOY_HOOK,
#   TIMBOLU_INTEGRATION_WORKER_DEPLOY_HOOK, TIMBOLU_WA_GATEWAY_DEPLOY_HOOK, TIMBOLU_MIGRATE_DEPLOY_HOOK
#
# The hook answers as soon as it has queued the build — the build itself happens on the server — so
# the call is retried hard and bounded rather than trusted once. A transient network failure is not a
# failed deployment, and letting one fail the job leaves that service on the previous image: the
# integration worker was left behind exactly that way by a broken connection (`curl` exit 56).

on:
  push:
    branches: [main]

concurrency:
  # One deployment at a time per branch: two runs racing would apply the same migration twice and
  # start two sets of images.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- what changed
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_js: ${{ steps.filter.outputs.backend_js }}
      gateway: ${{ steps.filter.outputs.gateway }}
      migrations: ${{ steps.filter.outputs.migrations }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            backend:
              - 'apps/backend/**'
              - 'packages/**/*.go'
              - 'packages/go.mod'
              - 'packages/go.sum'
            # The Bun port of the same three services. Its own filter because it shares no build
            # input with the Go tree — see the note at the top of this file.
            backend_js:
              - 'apps/backend-js/**'
            gateway:
              - 'apps/whatsapp-gw/**'
              - 'packages/**/*.go'
              - 'packages/go.mod'
              - 'packages/go.sum'
            migrations:
              - 'apps/backend/migrations/**'
            # Files that decide how every image is built, or whether any is built at all. Bare
            # names, not `/<name>`: see the note at the top of this file.
            build:
              - '.dockerignore'
              - 'Makefile'
              - 'go.work'
              - 'go.work.sum'
              - 'docker-compose*.yml'
              - '.github/workflows/**'

  # ---------------------------------------------------------------- schema first
  migrate:
    name: Apply migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy timbolu-migrate
        env:
          DEPLOY_HOOK: ${{ secrets.TIMBOLU_MIGRATE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "TIMBOLU_MIGRATE_DEPLOY_HOOK is not set; see docs/deployment.md" >&2
            exit 1
          fi
          # The hook is Easypanel's own; what this workflow owns is the *order* — migrate, then roll
          # the new images out.
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$DEPLOY_HOOK"

  # ---------------------------------------------------------------- backend
  backend:
    name: Deploy ${{ matrix.service }}
    needs: [changes, migrate]
    # `always()` so a *skipped* `migrate` (no new migration) does not skip the rollout, and the
    # explicit result check so a *failed* migration still blocks it. `backend_js` rolls the same
    # three services: they are the same processes, built from the Bun tree instead of the Go one.
    if: >-
      always() &&
      !cancelled() &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.backend_js == 'true' ||
       needs.changes.outputs.build == 'true') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      # One service failing must not stop the others: they are separate processes, and a bad
      # agent-worker image is no reason to leave the API on the previous one.
      fail-fast: false
      matrix:
        include:
          - service: timbolu-backend
            hook: BACKEND
          - service: timbolu-agent-worker
            hook: AGENT_WORKER
          - service: timbolu-integration-worker
            hook: INTEGRATION_WORKER
    env:
      # `secrets` cannot be indexed by an expression, so every hook is exposed and the step picks the
      # one its matrix entry names.
      HOOK_BACKEND: ${{ secrets.TIMBOLU_BACKEND_DEPLOY_HOOK }}
      HOOK_AGENT_WORKER: ${{ secrets.TIMBOLU_AGENT_WORKER_DEPLOY_HOOK }}
      HOOK_INTEGRATION_WORKER: ${{ secrets.TIMBOLU_INTEGRATION_WORKER_DEPLOY_HOOK }}
    steps:
      - name: Deploy ${{ matrix.service }}
        env:
          HOOK_NAME: HOOK_${{ matrix.hook }}
        run: |
          hook="${!HOOK_NAME}"
          if [ -z "$hook" ]; then
            echo "TIMBOLU_${{ matrix.hook }}_DEPLOY_HOOK is not set; see docs/deployment.md" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$hook"

  # ---------------------------------------------------------------- gateway
  gateway:
    name: Deploy timbolu-wa-gateway
    needs: [changes, migrate]
    # Its own job rather than a fourth matrix entry, because it is its own module: a change to
    # `apps/whatsapp-gw/**` should roll the gateway and nothing else. The Go module under `packages/`
    # counts as a change here too, since the gateway imports it.
    if: >-
      always() &&
      !cancelled() &&
      (needs.changes.outputs.gateway == 'true' || needs.changes.outputs.build == 'true') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy timbolu-wa-gateway
        env:
          DEPLOY_HOOK: ${{ secrets.TIMBOLU_WA_GATEWAY_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "TIMBOLU_WA_GATEWAY_DEPLOY_HOOK is not set; see docs/deployment.md" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$DEPLOY_HOOK"

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Deploy timbolu
    needs: [changes, migrate]
    if: >-
      always() &&
      !cancelled() &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.build == 'true') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy timbolu
        env:
          DEPLOY_HOOK: ${{ secrets.TIMBOLU_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "TIMBOLU_FRONTEND_DEPLOY_HOOK is not set; see docs/deployment.md" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$DEPLOY_HOOK"

  # ---------------------------------------------------------------- did it land
  # A green hook is not a finished deploy. The hook answers when Easypanel has queued the build, and
  # the build itself happens on the server, so a build that fails there — or a hook pointing at the
  # wrong service — leaves this workflow green while production keeps serving the previous image
  # (#322). That is worse than a red run: nothing in GitHub ever says the change did not ship.
  #
  # The one identity the deployed process can prove about itself is `/api/health`'s `data.build`: the
  # fingerprint baked in at build time from every Go file of the backend and the shared module (see
  # apps/backend/Dockerfile). The same command run on the tree this workflow checked out yields the
  # value this commit's image must report. Equal values mean the image serving traffic is this tree;
  # anything else means the build did not land, whatever the hook answered.
  #
  # Two implementations can be the one behind that endpoint now: the Go image (`backend`) and the Bun
  # port (`backend_js`), which is what production actually runs today (#350). Each has its own file
  # set and therefore its own fingerprint, so the step computes the expected value for every filter
  # that changed and accepts either match. The Bun tree does not report `data.build` yet, so a
  # `backend_js` deploy cannot be proven by this check — the step fails and says so instead of
  # calling the image stale, because an empty value names an unidentifiable implementation, not an
  # old one.
  #
  # That fingerprint says nothing about the frontend, which is the service most likely to ship alone:
  # a commit that only touches `apps/frontend/**` skips the fingerprint step entirely and leaves
  # "the site answers 200" as the only check — which the previous image passes just as well. What the
  # frontend does expose is the mtime of the assets it serves: Next writes content-hashed chunks, so
  # the HTML of a build names only that build's chunks, and each chunk's `Last-Modified` is the
  # moment the build wrote it. A chunk older than this commit is an earlier build still being served.
  verify:
    name: Verify the deploy landed
    needs: [changes, migrate, backend, gateway, frontend]
    # Runs even when a rollout job failed, so it can name which one, and never runs when nothing was
    # supposed to be deployed. `build` is in the condition for the same reason it is in every deploy
    # job's: a root build file (`.dockerignore`, `go.work`, …) rolls every image, and a rollout
    # nothing verifies is exactly the hole #322 fell through.
    if: >-
      always() &&
      !cancelled() &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.backend_js == 'true' ||
       needs.changes.outputs.gateway == 'true' ||
       needs.changes.outputs.build == 'true')
    runs-on: ubuntu-latest
    env:
      CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
      CHANGED_BACKEND: ${{ needs.changes.outputs.backend }}
      CHANGED_BACKEND_JS: ${{ needs.changes.outputs.backend_js }}
      CHANGED_GATEWAY: ${{ needs.changes.outputs.gateway }}
      CHANGED_BUILD: ${{ needs.changes.outputs.build }}
      RESULT_BACKEND: ${{ needs.backend.result }}
      RESULT_GATEWAY: ${{ needs.gateway.result }}
      RESULT_FRONTEND: ${{ needs.frontend.result }}
      # The commit's own time, which the frontend's assets have to postdate. From the event rather
      # than the clock, so a rerun of this run compares against the same value.
      COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
    steps:
      - name: Fail when a rollout did not succeed
        run: |
          # The deploy jobs own separate hooks; one of them failing must fail the run instead of
          # being absorbed by a job that only looks at the site. `migrate` is covered through
          # `backend`, which cannot succeed when the migration it waits for did not.
          #
          # "Should this job have run" is `changed || build`: a root build file rolls every image, so
          # on a build-only commit all three rollouts run with `changed` false. The deploy jobs use
          # that same condition; keeping it in one place here means the two cannot drift. The backend
          # matrix is the one job two filters can trigger, so its two are folded together before the
          # check: either tree changing rolls it.
          should_run() {
            [ "$1" = "true" ] || [ "$CHANGED_BUILD" = "true" ]
          }
          backend_changed=false
          if [ "$CHANGED_BACKEND" = "true" ] || [ "$CHANGED_BACKEND_JS" = "true" ]; then
            backend_changed=true
          fi
          failed=0
          check() {
            changed="$1"; result="$2"; job="$3"
            should_run "$changed" || return 0
            if [ "$result" != "success" ]; then
              echo "::error::$job finished '$result' although its paths changed" >&2
              failed=1
            fi
          }
          check "$CHANGED_FRONTEND" "$RESULT_FRONTEND" "Deploy timbolu"
          check "$backend_changed" "$RESULT_BACKEND" "Deploy (backend matrix)"
          check "$CHANGED_GATEWAY" "$RESULT_GATEWAY" "Deploy timbolu-wa-gateway"
          exit "$failed"

      - name: Check out the tree that was deployed
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_js == 'true' || needs.changes.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Wait for production to serve this tree's backend build
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_js == 'true' || needs.changes.outputs.build == 'true'
        run: |
          # Two implementations can answer this endpoint, and each fingerprints its own file set. The
          # Go command is the one apps/backend/Dockerfile runs, over the same files (`.dockerignore`
          # excludes no `.go` file, so the sets match); if that ever stops being true, this has to
          # follow it or the comparison stops meaning anything. The Bun command covers what
          # apps/backend-js/Dockerfile copies into its image. Only the sets this commit actually
          # changed are computed, so a match can only come from an image this run was meant to roll.
          go_expected=""
          bun_expected=""
          if [ "$CHANGED_BACKEND" = "true" ] || [ "$CHANGED_BUILD" = "true" ]; then
            go_expected="$(find apps/backend packages -name '*.go' -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-16)"
            echo "this tree's Go build fingerprint:  $go_expected"
          fi
          if [ "$CHANGED_BACKEND_JS" = "true" ] || [ "$CHANGED_BUILD" = "true" ]; then
            bun_expected="$(find apps/backend-js/src -name '*.ts' -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-16)"
            echo "this tree's Bun build fingerprint: $bun_expected"
          fi

          # Eight minutes: an image build plus the rollout, with the first build after a cold cache
          # being the slow end. A build that has not landed by then is not about to.
          deadline=$((SECONDS + 480))
          while :; do
            body="$(curl --silent --show-error --max-time 30 https://timbolu.com/api/health || true)"
            served="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("data") or {}).get("build") or "")' 2>/dev/null || true)"
            echo "production serves build: '${served}'"
            if [ -n "$go_expected" ] && [ "$served" = "$go_expected" ]; then
              echo "production is serving this tree's Go build"
              exit 0
            fi
            if [ -n "$bun_expected" ] && [ "$served" = "$bun_expected" ]; then
              echo "production is serving this tree's Bun build"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ -z "$served" ]; then
                # No value, no identity. The Bun port does not report `data.build` yet (#350), and an
                # empty answer could equally come from a Go image older than #303. Either way this
                # check cannot say which implementation is serving production, so it cannot pass —
                # but it must not claim the image is stale, because that is exactly what it cannot
                # see.
                echo "::error::production's /api/health carries no data.build after 8 minutes, so the implementation serving production cannot be identified — the Bun port reports no fingerprint yet (#350), and an older Go image would look the same. This is not a pass." >&2
              else
                echo "::error::production still serves build '$served' after 8 minutes; this tree is '${go_expected:-not changed}' (Go) / '${bun_expected:-not changed}' (Bun) — the deploy hook was accepted but the build did not land" >&2
              fi
              exit 1
            fi
            sleep 20
          done

      - name: Wait for production to serve this tree's frontend build
        # The fingerprint step above covers the backend only, and the frontend is the service that
        # ships on its own most often: for a commit that touches only `apps/frontend/**` this step is
        # the only thing between a green run and a build that never landed (#322).
        #
        # Two different questions reach this one step, and answering both with one rule is what made
        # it lie (#357):
        #
        #   frontend changed (`apps/frontend/**`) — the image has to be new, so a served chunk must
        #     postdate the commit. This is the #322 case, and it stays exactly as strict as it was.
        #
        #   build filter only (`.github/workflows/**`, `Makefile`, `.dockerignore`, `go.work`,
        #     `go.work.sum`, `docker-compose*.yml`) — the frontend is redeployed, but `RUN npm run
        #     build` is answered by the Docker layer cache, because not one of its inputs changed.
        #     The chunks come out byte-identical and carry the *old layer's* mtime, so demanding a
        #     newer mtime asks production to prove something the cache exists to make false. That is
        #     what turned run 40891694184 (commit 0c19a3c, #355) red on a correct deploy, with the
        #     backend step green. A gate that fails on a correct deploy gets ignored, and an ignored
        #     gate is how #329 was misdiagnosed — so the false red is a defect in the gate, not noise
        #     to live with.
        #
        # What the build-only case can honestly prove from outside: `/login` answers 200, it still
        # names its content-hashed chunks, and every chunk it names is served (an image that rolled
        # out half-written would 404 one of them). The whole chunk set is printed, so two runs can be
        # compared by eye. Comparing that set against the *previous* build's set would be the
        # stronger proof, but it needs the previous set kept somewhere, and this workflow keeps no
        # state between runs — inventing a store for it is a separate decision, not this fix.
        # `Last-Modified` is still read and printed for the record, and deliberately not compared to
        # the commit: for a build-only commit it is the cached layer's clock by design.
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.build == 'true'
        run: |
          # Eight minutes, same as the fingerprint step: one image build plus the rollout, with the
          # first build after a cold cache being the slow end. A build that has not landed by then is
          # not about to.
          deadline=$((SECONDS + 480))

          if [ "$CHANGED_FRONTEND" = "true" ]; then
            echo "judging this deploy as: frontend changed (apps/frontend/**) — the served assets must postdate the commit"
            if [ -z "$COMMIT_TIMESTAMP" ]; then
              echo "::error::github.event.head_commit.timestamp is empty, so there is nothing to compare the frontend build against" >&2
              exit 1
            fi
            commit_epoch="$(python3 -c 'import sys; from datetime import datetime; print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))' "$COMMIT_TIMESTAMP")"
            echo "this commit: $COMMIT_TIMESTAMP ($commit_epoch)"

            # `/login` is served by the frontend image itself, and its HTML names the content-hashed
            # chunks that image ships. The cache-busting query keeps a CDN copy of the previous
            # build's HTML from answering for this one; on the chunk it only skips a cached header,
            # since the path already carries the hash.
            #
            # Five minutes of slack: `Last-Modified` is the build server's clock and the commit time
            # is GitHub's, and those are different machines, so inside that window the ordering
            # proves nothing either way. Outside it, an older chunk is a previous build still being
            # served.
            tolerance=300
            while :; do
              html="$(curl --silent --show-error --max-time 30 "https://timbolu.com/login?verify=${SECONDS}" || true)"
              chunk="$(printf '%s' "$html" | python3 -c 'import re,sys; m=re.search(r"/_next/static/chunks/[^\s\"<>]+\.js", sys.stdin.read()); print(m.group(0) if m else "")' || true)"
              last_modified=""
              lm_epoch=""
              if [ -z "$chunk" ]; then
                echo "/login carries no /_next/static/chunks/*.js; retrying"
              else
                headers="$(curl --silent --show-error --max-time 30 --output /dev/null --dump-header - "https://timbolu.com${chunk}?verify=${SECONDS}" || true)"
                last_modified="$(printf '%s' "$headers" | python3 -c 'import sys; print(next((line.split(":",1)[1].strip() for line in sys.stdin if line.lower().startswith("last-modified:")), ""))' || true)"
                if [ -n "$last_modified" ]; then
                  lm_epoch="$(python3 -c 'import sys; from email.utils import parsedate_to_datetime; print(int(parsedate_to_datetime(sys.argv[1]).timestamp()))' "$last_modified" 2>/dev/null || true)"
                fi
                echo "production serves $chunk last modified: '${last_modified}'"
                if [ -n "$lm_epoch" ] && [ "$lm_epoch" -ge $((commit_epoch - tolerance)) ]; then
                  echo "production is serving this tree's frontend build"
                  exit 0
                fi
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                if [ -z "$last_modified" ]; then
                  # No header, no proof. The check cannot tell this build from the one it replaced,
                  # so it must not pass — and the fix is to find another fingerprint, not to drop
                  # the check: a green run is what #322 was.
                  echo "::error::frontend changed, and no readable Last-Modified came back for ${chunk:-the frontend assets} after 8 minutes; the age of the frontend build cannot be proven, so this is not a pass" >&2
                else
                  echo "::error::frontend changed: production serves $chunk last modified $last_modified, older than this commit ($COMMIT_TIMESTAMP) minus 5 minutes of clock slack — the frontend build did not land" >&2
                fi
                exit 1
              fi
              sleep 20
            done
          fi

          echo "judging this deploy as: build filter only (no apps/frontend/** change) — the image is rebuilt from cached layers, so its assets keep the old layer's mtime and their age proves nothing"
          while :; do
            problem=""
            # `--fail` so a 5xx from a container mid-rollout is not parsed as a page with no chunks.
            if ! html="$(curl --fail --silent --show-error --max-time 30 "https://timbolu.com/login?verify=${SECONDS}")"; then
              problem="/login did not answer 200"
            else
              chunks="$(printf '%s' "$html" | python3 -c 'import re,sys; print("\n".join(dict.fromkeys(re.findall(r"/_next/static/chunks/[^\s\"<>]+\.js", sys.stdin.read()))))' || true)"
              if [ -z "$chunks" ]; then
                problem="/login answers 200 but names no /_next/static/chunks/*.js"
              else
                echo "production serves these frontend chunks:"
                printf '  %s\n' $chunks
                missing=""
                for chunk in $chunks; do
                  headers="$(curl --silent --show-error --max-time 30 --output /dev/null --dump-header - "https://timbolu.com${chunk}?verify=${SECONDS}" || true)"
                  status="$(printf '%s' "$headers" | python3 -c 'import sys; fields=sys.stdin.readline().split(); print(fields[1] if len(fields) > 1 else "-")' || true)"
                  last_modified="$(printf '%s' "$headers" | python3 -c 'import sys; print(next((line.split(":",1)[1].strip() for line in sys.stdin if line.lower().startswith("last-modified:")), "-"))' || true)"
                  echo "  $chunk -> ${status:-no answer}, last modified: '${last_modified}'"
                  [ "$status" = "200" ] || missing="$missing $chunk"
                done
                if [ -z "$missing" ]; then
                  echo "every chunk /login names is served, so the frontend image is whole; its age is not read from mtime here (the build layer is a cache hit), and the chunk set above is the record to compare against another run"
                  exit 0
                fi
                problem="these chunks named by /login were not served:${missing}"
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::build filter only (no apps/frontend/** change): $problem after 8 minutes — the frontend image serving production is unreachable or incomplete. The age of the build is deliberately not part of this check: a build-only commit reuses the cached build layer, so its assets keep the old layer's timestamp by design" >&2
              exit 1
            fi
            echo "$problem; retrying"
            sleep 20
          done

      - name: Check the site answers
        # Liveness only, and that is all it proves: `/api/ready` says the API reaches its configured
        # dependencies and `/` says the frontend is up. Both can answer from the previous image; the
        # fingerprint and chunk steps above are the ones that say the builds are new.
        if: always() && !cancelled()
        run: |
          for url in https://timbolu.com/api/ready https://timbolu.com/; do
            deadline=$((SECONDS + 180))
            until curl --fail --silent --show-error --max-time 30 --output /dev/null "$url"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url did not answer 200 within 3 minutes" >&2
                exit 1
              fi
              sleep 10
            done
            echo "$url answered 200"
          done
