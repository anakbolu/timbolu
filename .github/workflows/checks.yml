name: Checks

# The PR-time gate for the shared sources that a change can silently desynchronise, and for the tree
# that serves production.
#
# `docs/api.md` is the source of truth for the realtime event names, and three places have to agree
# with it: `packages/contracts/events.ts`, the Go constants, and the frontend's handlers. When they
# drift, nothing fails to compile — a task's progress simply stops arriving on a screen — so the
# drift is found by a person noticing a blank panel, which is how #310 and #328 were found and fixed
# by hand. `make contracts-check` is the check that turns that into a red run.
#
# `packages/design-tokens/tokens.json` is the same shape of problem for the theme: it mirrors the
# `@theme` block in the frontend's `globals.css`, and a token added on one side only means a colour
# that exists in one place and not the other. `make design-tokens-check` compares the two.
#
# The route audit in `docs/deep-links.md` is the same shape of problem for the links themselves:
# its table has to agree with the pages that really exist under `apps/frontend/src/app`, because
# that table is what the iOS team, the AASA file, and a support answer are all written from.
# Renaming a page without moving its row compiles cleanly and breaks nothing at build time — the
# link just lands nowhere, or lands on the wrong screen — so the drift is found when someone
# follows a link rather than when a machine reads the code. `make deep-links-check` diffs the
# table against the filesystem.
#
# All three scripts are plain Node with `node:fs`/`node:path` and no dependencies, so there is
# nothing to install and no lockfile to cache: the repository has no root `package.json`, and the
# frontend's dependencies are not involved. That is also why this workflow runs `make` rather than
# the scripts directly — the Makefile is what a person runs locally, and the two must not drift.
#
# The second job applies the same rule to `apps/backend-js`, the tree `timbolu.com/api/**` is served
# by: its typecheck and its suite also ran only when someone remembered `make ci`, and #355 is what
# silence around this tree already cost once — a Bun-only commit went green because no filter matched
# it. Unlike the three scripts it has dependencies, so the job installs them first.
#
# This is a gate, not a deploy. `deployment.yml` owns turning a push to `main` into a rollout and is
# deliberately untouched by this file; a failing check here blocks the merge, which is the earlier
# and cheaper place to stop a bad commit.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per ref: pushing a fix to an open PR cancels the run it supersedes, since the answer for
  # the previous commit is no longer what anyone is waiting for.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Contracts and design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, the same major the frontend builds with, so a script that relies on a newer runtime
      # fails here rather than only on a developer's machine.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Event names agree with docs/api.md
        run: make contracts-check

      - name: Design tokens agree with the @theme block in globals.css
        run: make design-tokens-check

      - name: Deep-link route audit agrees with apps/frontend/src/app
        run: make deep-links-check

  # The gates for the tree production runs, in the same workflow and the same concurrency group so a
  # pull request gets one answer from both.
  backend-js:
    name: Bun typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest`, so a Bun release cannot turn this gate red on its own: 1.4.4 is
      # the version the suite was developed against and the same 1.4 line the image ships
      # (`oven/bun:1.4-slim`, apps/backend-js/Dockerfile).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The Makefile's two Bun targets never install, so this step is their prerequisite;
      # `--frozen-lockfile` makes a lockfile that disagrees with `package.json` red here instead of
      # resolving a tree the image does not have.
      - name: Install
        run: cd apps/backend-js && bun install --frozen-lockfile

      - name: Typecheck
        run: make typecheck-backend-js

      - name: Tests
        run: make test-backend-js
