# Local development stack: Postgres (with pgvector), Redis, Temporal and its UI,
# the migration step, and the four backend processes.
#
# Migrations run as their own one-shot service before the API starts, which is
# the same order the deployment pipeline uses.

name: timbolu

x-backend-env: &backend-env
  ENVIRONMENT: local
  DATABASE_URL: "postgres://${POSTGRES_USER:-employeebot}:${POSTGRES_PASSWORD:-employeebot_secret}@postgres:5432/${POSTGRES_DB:-employeebot}?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  TEMPORAL_HOST_PORT: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE_AGENT: "bolu-agent"
  TEMPORAL_TASK_QUEUE_INTEGRATION: "bolu-integration"
  # Where the API points a person who needs to open a stuck task's workflow: the self-hosted
  # UI's mapped port, which is what a browser on the host can reach.
  TEMPORAL_UI_BASE_URL: ${TEMPORAL_UI_BASE_URL:-http://localhost:8233}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
  # Whether a new account must confirm its email address before it may use the
  # product. Off locally so a developer reaches the dashboard without a mail
  # server; production turns it on.
  AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
  # Base URL of the web app: where verification, reset, and invitation links
  # point, and where the Google callback returns the browser.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  # Object storage: attachments and the sandboxed HTML documents a message
  # renders. Local development writes to a directory inside the container.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_ROOT: /data/storage
  # Which file types an upload may be, by extension, comma separated. It can only
  # narrow the module's own list, so empty is the list of images, PDFs, office
  # documents, and text.
  ATTACHMENT_ALLOWED_EXTENSIONS: ${ATTACHMENT_ALLOWED_EXTENSIONS:-}
  # The origin the sandboxed documents are served from. Locally the API serves
  # them itself; production points this at a separate host.
  CONTENT_ORIGIN: ${CONTENT_ORIGIN:-http://localhost:8080}
  # The origin allowed to frame a content document. It must name the app, because
  # the document is served from a different host by design.
  CONTENT_FRAME_ANCESTORS: ${CONTENT_FRAME_ANCESTORS:-http://localhost:3000}
  # Model gateway: the key that seals provider secrets at rest, and the provider
  # the platform offers a workspace that configured none. Leaving the model empty
  # disables the fallback, so every workspace must configure its own.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-local_dev_secret_key_32_byte_len}
  # The key ring that seals integration tokens, and the key that signs the value
  # an authorization flow carries. Empty leaves the hub's writes disabled, which
  # is what a deployment that has not set them looks like.
  KMS_MASTER_KEY: ${KMS_MASTER_KEY:-local_dev_master_key_32_byte_len}
  KMS_MASTER_KEY_ID: ${KMS_MASTER_KEY_ID:-local-v1}
  KMS_RETIRED_KEYS: ${KMS_RETIRED_KEYS:-}
  OAUTH_STATE_KEY: ${OAUTH_STATE_KEY:-local_dev_oauth_state_key_32_bytes}
  INTEGRATION_CALLS_PER_MINUTE: ${INTEGRATION_CALLS_PER_MINUTE:-0}
  INTEGRATION_RATE_LIMITS: ${INTEGRATION_RATE_LIMITS:-}
  # Gmail is the integration the MVP is built around. Both credentials empty
  # disables the adapter rather than offering it and failing at the consent
  # screen. The endpoint overrides exist so a staging deployment or a smoke test
  # can run the whole path without a real Google account.
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_API_BASE: ${GMAIL_API_BASE:-}
  GMAIL_AUTH_ENDPOINT: ${GMAIL_AUTH_ENDPOINT:-}
  GMAIL_TOKEN_ENDPOINT: ${GMAIL_TOKEN_ENDPOINT:-}
  # Slack and GitHub are the other connectors, under the same rules: empty
  # credentials disable the adapter rather than offering it and failing at the
  # consent screen, and the endpoint overrides let a staging deployment or a
  # smoke test run the whole path without a real account.
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_API_BASE: ${SLACK_API_BASE:-}
  SLACK_AUTH_ENDPOINT: ${SLACK_AUTH_ENDPOINT:-}
  SLACK_TOKEN_ENDPOINT: ${SLACK_TOKEN_ENDPOINT:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_API_BASE: ${GITHUB_API_BASE:-}
  GITHUB_AUTH_ENDPOINT: ${GITHUB_AUTH_ENDPOINT:-}
  GITHUB_TOKEN_ENDPOINT: ${GITHUB_TOKEN_ENDPOINT:-}
  # WhatsApp: the API reaches the gateway process over the compose network, and
  # the gateway authenticates with a shared secret. Both empty leaves numbers
  # readable and unlinkable, which is what a deployment with no gateway is.
  WA_GATEWAY_URL: ${WA_GATEWAY_URL:-http://wa-gateway:8090}
  WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-local_dev_wa_gateway_token}
  # The gateway's own listen address, and the default hourly send ceiling.
  WA_ADDRESS: ${WA_ADDRESS:-:8090}
  WA_OWNER: ${WA_OWNER:-}
  WA_HOURLY_LIMIT: ${WA_HOURLY_LIMIT:-0}
  # whatsmeow's own protocol log writes a line per decrypted message.
  WA_LOG_WHATSMEOW: ${WA_LOG_WHATSMEOW:-false}
  LLM_DEFAULT_ADAPTER: ${LLM_DEFAULT_ADAPTER:-}
  LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
  LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:-}
  LLM_QUOTA_ENABLED: ${LLM_QUOTA_ENABLED:-false}
  LLM_TOKENS_PER_PERIOD: ${LLM_TOKENS_PER_PERIOD:-0}
  LLM_CHAIN_LIMIT: ${LLM_CHAIN_LIMIT:-3}
  # The cost ceiling of one day per workspace, in micro-rupiah. Zero means
  # unlimited. It is the second bound the quota asks, alongside the period's
  # token allowance. With billing wired, each package carries its own ceiling and
  # this is what a deployment without packages runs with.
  PLAN_DAILY_COST_MICROS: ${PLAN_DAILY_COST_MICROS:-0}
  # Billing: the package a workspace is on, the allowance it grants, and how it is
  # paid for. Leaving the Duitku values empty keeps the module on and its online
  # payment off — an invoice is written and the screen says to transfer and
  # confirm, which is how the first customers pay. The callback URL is required to
  # take payment at all: Duitku posts the notification there and reaches it from
  # outside the compose network.
  BILLING_PROVIDER: ${BILLING_PROVIDER:-}
  DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE:-}
  DUITKU_API_KEY: ${DUITKU_API_KEY:-}
  DUITKU_SANDBOX: ${DUITKU_SANDBOX:-true}
  DUITKU_PAYMENT_METHOD: ${DUITKU_PAYMENT_METHOD:-}
  DUITKU_EXPIRY_MINUTES: ${DUITKU_EXPIRY_MINUTES:-0}
  DUITKU_CALLBACK_URL: ${DUITKU_CALLBACK_URL:-}
  DUITKU_RETURN_URL: ${DUITKU_RETURN_URL:-}
  DUITKU_BASE_URL: ${DUITKU_BASE_URL:-}
  BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-0}
  BILLING_SYNC_INTERVAL: ${BILLING_SYNC_INTERVAL:-15m}
  BILLING_SWEEP_INTERVAL: ${BILLING_SWEEP_INTERVAL:-15m}
  # Telemetry: where traces go. Empty leaves it off, which is what a local stack wants;
  # point OTEL_ENDPOINT at a collector to send them.
  OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
  OTEL_INSECURE: ${OTEL_INSECURE:-true}
  # Metrics: "prometheus" serves them at /metrics for a scraper, "otlp" pushes them to a
  # collector. Off by default, like the traces.
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-}
  OTEL_METRICS_INTERVAL: ${OTEL_METRICS_INTERVAL:-60s}
  # The workers have no HTTP API of their own, so each serves /health, /ready, and /metrics on
  # this address. The API answers on its own listener already.
  OPS_ADDRESS: ${OPS_ADDRESS:-}
  # Retention: how long the raw payload of a task step and an attachment are kept,
  # and how often the pass that removes them runs. Local development disables the
  # job so a payload somebody is reading is still there.
  RETENTION_STEP_DAYS: ${RETENTION_STEP_DAYS:-30}
  RETENTION_ATTACHMENT_DAYS: ${RETENTION_ATTACHMENT_DAYS:-0}
  RETENTION_INTERVAL: ${RETENTION_INTERVAL:-0s}
  RETENTION_BATCH: ${RETENTION_BATCH:-500}
  RETENTION_SWEEP_LIMIT: ${RETENTION_SWEEP_LIMIT:-200}
  # What one task may spend. A zero falls back to the product default.
  TASK_MAX_STEPS: ${TASK_MAX_STEPS:-12}
  TASK_MAX_TOKENS: ${TASK_MAX_TOKENS:-120000}
  TASK_MAX_HANDOFF_DEPTH: ${TASK_MAX_HANDOFF_DEPTH:-2}
  TASK_MAX_TOOL_RESULT_BYTES: ${TASK_MAX_TOOL_RESULT_BYTES:-16384}

services:
  postgres:
    # pgvector ships in this image, which memory and knowledge search require.
    image: pgvector/pgvector:pg16
    container_name: bolu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-employeebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employeebot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-employeebot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-employeebot} -d $${POSTGRES_DB:-employeebot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bolu-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    # Self-hosted for local development; staging and production use Temporal
    # Cloud in Singapore (see docs/adr/0001-temporal-dan-region.md).
    image: temporalio/auto-setup:1.26.2
    container_name: bolu-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-employeebot}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-employeebot_secret}
      POSTGRES_SEEDS: postgres
      # auto-setup creates this namespace during provisioning; the API and the
      # workers connect to it.
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: bolu-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  migrate:
    # One-shot: applies every migration, then exits. api and the workers wait
    # for it to complete, so a schema change is never half applied.
    image: migrate/migrate:v4.18.3
    container_name: bolu-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-employeebot}:${POSTGRES_PASSWORD:-employeebot_secret}@postgres:5432/${POSTGRES_DB:-employeebot}?sslmode=disable"
      - "up"
    restart: "no"

  api:
    build:
      # The context is the repository root because the backend imports the shared
      # packages/ module, and a Docker build does not read go.work.
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        BINARY: api
    container_name: bolu-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      HTTP_ADDRESS: ":8080"
      # The second half of the seam: the gateway records what arrived and pulls
      # what is due over this address. It is never published, because it speaks
      # for every tenant at once and authenticates with one shared secret.
      INTERNAL_ADDRESS: ${INTERNAL_ADDRESS:-:8091}
    volumes:
      # Attachments and sandboxed content documents. The workers mount the same
      # volume, so a file the API stores is one a worker can read.
      - storage_data:/data/storage
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  agent-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        BINARY: agent-worker
    container_name: bolu-agent-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      # The virtual computer (docs/adr/0003-virtual-computer.md). Only this process is given
      # the three: it is the one that registers the module's activities, and the token is a
      # shared secret the API, the gateway, and the integration worker have no use for. An
      # empty address is a deployment without a control plane, which is what a stack that
      # never names the overlay gets; reaching one is what docker-compose.vcomputer.yml adds.
      VCOMPUTER_CONTROL_URL: ${VCOMPUTER_CONTROL_URL:-}
      VCOMPUTER_CONTROL_TOKEN: ${VCOMPUTER_CONTROL_TOKEN:-}
      VCOMPUTER_CONTROL_TIMEOUT: ${VCOMPUTER_CONTROL_TIMEOUT:-30s}
    volumes:
      # The same directory the API writes to: a worker reads an attachment the
      # API stored, so the two must see one filesystem.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The process that owns the WhatsApp connections. It is separate from the API
  # because a session is a socket that stays open: an API that is replaced loses
  # nothing, and a number whose socket died with it is a number that is offline.
  wa-gateway:
    build:
      # Its own Dockerfile and its own module: the gateway imports the shared
      # packages/ module and nothing of the backend's, and it carries no Temporal
      # client. It needs no Temporal to run, so it does not wait for one.
      context: .
      dockerfile: apps/whatsapp-gw/Dockerfile
    container_name: bolu-wa-gateway
    restart: unless-stopped
    environment:
      <<: *backend-env
      # The other direction of the seam: the gateway reaches the API's internal
      # listener to record what arrived, pull what is due, and report status.
      WA_API_URL: ${WA_API_URL:-http://api:8091}
    volumes:
      # The same directory the API writes to: an attachment the gateway downloads
      # is read back by the API that serves it.
      - storage_data:/data/storage
    # No published port. The gateway speaks for every tenant it serves, so it is
    # reached only from inside the stack.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

  integration-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        BINARY: integration-worker
    container_name: bolu-integration-worker
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # One directory shared by the API and both workers, so a file stored by one
      # process is readable by the others.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
        # so the API URL has to be a build argument, not a runtime variable.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Where sandboxed HTML documents are framed from. In production this is a
        # different origin from the app, which is what makes the sandbox
        # meaningful; locally the API serves them.
        NEXT_PUBLIC_CONTENT_ORIGIN: ${CONTENT_ORIGIN:-http://localhost:8080}
        # Whether the sign-in pages offer Google. Off until a Google client is
        # registered for this deployment.
        NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: ${NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED:-false}
    container_name: bolu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  # Attachment and content bytes. A named volume rather than a bind mount, so the
  # same compose file works on a machine that has no checkout of the repository.
  storage_data:
