# Local development stack: Postgres (with pgvector), Redis, Temporal and its UI,
# the migration step, and the three backend processes.
#
# Migrations run as their own one-shot service before the API starts, which is
# the same order the deployment pipeline uses.

name: timbolu

x-backend-env: &backend-env
  ENVIRONMENT: local
  DATABASE_URL: "postgres://${POSTGRES_USER:-employeebot}:${POSTGRES_PASSWORD:-employeebot_secret}@postgres:5432/${POSTGRES_DB:-employeebot}?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  TEMPORAL_HOST_PORT: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE_AGENT: "bolu-agent"
  TEMPORAL_TASK_QUEUE_INTEGRATION: "bolu-integration"
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
  # Base URL of the web app: where verification, reset, and invitation links
  # point, and where the Google callback returns the browser.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  # Object storage: attachments and the sandboxed HTML documents a message
  # renders. Local development writes to a directory inside the container.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_ROOT: /data/storage
  # The origin the sandboxed documents are served from. Locally the API serves
  # them itself; production points this at a separate host.
  CONTENT_ORIGIN: ${CONTENT_ORIGIN:-http://localhost:8080}
  # The origin allowed to frame a content document. It must name the app, because
  # the document is served from a different host by design.
  CONTENT_FRAME_ANCESTORS: ${CONTENT_FRAME_ANCESTORS:-http://localhost:3000}
  # Model gateway: the key that seals provider secrets at rest, and the provider
  # the platform offers a workspace that configured none. Leaving the model empty
  # disables the fallback, so every workspace must configure its own.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-local_dev_secret_key_32_byte_len}
  LLM_DEFAULT_ADAPTER: ${LLM_DEFAULT_ADAPTER:-}
  LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
  LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:-}
  LLM_QUOTA_ENABLED: ${LLM_QUOTA_ENABLED:-false}
  LLM_TOKENS_PER_PERIOD: ${LLM_TOKENS_PER_PERIOD:-0}
  LLM_CHAIN_LIMIT: ${LLM_CHAIN_LIMIT:-3}
  # The cost ceiling of one day per workspace, in micro-rupiah. Zero means
  # unlimited. It is the second bound the quota asks, alongside the period's
  # token allowance.
  PLAN_DAILY_COST_MICROS: ${PLAN_DAILY_COST_MICROS:-0}
  # What one task may spend. A zero falls back to the product default.
  TASK_MAX_STEPS: ${TASK_MAX_STEPS:-12}
  TASK_MAX_TOKENS: ${TASK_MAX_TOKENS:-120000}
  TASK_MAX_HANDOFF_DEPTH: ${TASK_MAX_HANDOFF_DEPTH:-2}
  TASK_MAX_TOOL_RESULT_BYTES: ${TASK_MAX_TOOL_RESULT_BYTES:-16384}

services:
  postgres:
    # pgvector ships in this image, which memory and knowledge search require.
    image: pgvector/pgvector:pg16
    container_name: bolu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-employeebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employeebot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-employeebot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-employeebot} -d $${POSTGRES_DB:-employeebot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bolu-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    # Self-hosted for local development; staging and production use Temporal
    # Cloud in Singapore (see docs/adr/0001-temporal-dan-region.md).
    image: temporalio/auto-setup:1.26.2
    container_name: bolu-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-employeebot}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-employeebot_secret}
      POSTGRES_SEEDS: postgres
      # auto-setup creates this namespace during provisioning; the API and the
      # workers connect to it.
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: bolu-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  migrate:
    # One-shot: applies every migration, then exits. api and the workers wait
    # for it to complete, so a schema change is never half applied.
    image: migrate/migrate:v4.18.3
    container_name: bolu-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-employeebot}:${POSTGRES_PASSWORD:-employeebot_secret}@postgres:5432/${POSTGRES_DB:-employeebot}?sslmode=disable"
      - "up"
    restart: "no"

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BINARY: api
    container_name: bolu-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      HTTP_ADDRESS: ":8080"
    volumes:
      # Attachments and sandboxed content documents. The workers mount the same
      # volume, so a file the API stores is one a worker can read.
      - storage_data:/data/storage
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  agent-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BINARY: agent-worker
    container_name: bolu-agent-worker
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # The same directory the API writes to: a worker reads an attachment the
      # API stored, so the two must see one filesystem.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  integration-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BINARY: integration-worker
    container_name: bolu-integration-worker
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # One directory shared by the API and both workers, so a file stored by one
      # process is readable by the others.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
        # so the API URL has to be a build argument, not a runtime variable.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Where sandboxed HTML documents are framed from. In production this is a
        # different origin from the app, which is what makes the sandbox
        # meaningful; locally the API serves them.
        NEXT_PUBLIC_CONTENT_ORIGIN: ${CONTENT_ORIGIN:-http://localhost:8080}
    container_name: bolu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  # Attachment and content bytes. A named volume rather than a bind mount, so the
  # same compose file works on a machine that has no checkout of the repository.
  storage_data:
