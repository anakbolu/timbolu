# Mockery generates the mocks used by service unit tests from the domain
# interfaces. Generated mocks live next to the interface (domain/mocks) and are
# excluded from coverage and from the archcheck rules.
with-expecter: true
dir: "{{.InterfaceDir}}/mocks"
outpkg: "mocks"
mockname: "{{.InterfaceName}}"
packages:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/health/domain:
    interfaces:
      Repository:
      Checker:
      Service:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/auth/domain:
    interfaces:
      Repository:
      Service:
      TokenIssuer:
      StateSigner:
      Mailer:
      GoogleProvider:
      LoginThrottle:
      Passwords:
      Tokens:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/agent/domain:
    interfaces:
      Repository:
      Service:
      PlanLimits:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/workspace/domain:
    interfaces:
      Repository:
      Service:
      Mailer:
      Provisioner:
      Tokens:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/llm/domain:
    interfaces:
      Store:
      AgentStore:
      Factory:
      UsageRecorder:
      UsageReader:
      QuotaCounter:
      QuotaPolicy:
      CostTable:
      Gateway:
      Provider:
      SecretBox:
      Resolver:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/memory/domain:
    interfaces:
      Service:
      Repository:
      Conversation:
      Auditor:
      Scheduler:
      Completer:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/routine/domain:
    interfaces:
      Service:
      Repository:
      Engine:
      TaskStarter:
      WorkQueue:
      Auditor:
      WorkspaceClock:
  github.com/robzlabz/employeebot/apps/backend/internal/modules/chat/domain:
    interfaces:
      Service:
      ConversationRepository:
      MessageRepository:
      AttachmentRepository:
      EventStore:
      EventPublisher:
      AgentDirectory:
      Router:
      Responder:
      ObjectStore:
