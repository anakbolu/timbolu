# Non-local defaults. Every secret and every endpoint must be supplied through
# the environment: staging and production override the values below.
Application:
  Environment: "production"
  FrontendURL: ""
  CORSOrigins: []

Http:
  Address: ":8080"
  ReadTimeout: "30s"
  WriteTimeout: "30s"
  ApiPrefix: "/api"

Database:
  URL: ""
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

Redis:
  URL: ""

# Temporal Cloud (Singapore, aws-ap-southeast-1) for staging/production. Left
# empty on purpose so no endpoint is committed to the repository.
Temporal:
  HostPort: ""
  Namespace: ""
  TaskQueueAgent: "bolu-agent"
  TaskQueueIntegration: "bolu-integration"
  TLS: true
  APIKey: ""

JWT:
  Secret: ""
  ExpireHours: 24

Auth:
  AccessTokenMinutes: 15
  RefreshHours: 720
  VerificationHours: 24
  ResetMinutes: 60
  StateMinutes: 10
  CookieDomain: ""
  # The refresh cookie must only travel over HTTPS outside local development.
  CookieSecure: true
  LoginThrottleCapacity: 5
  LoginThrottleRefill: 0.2

Google:
  ClientID: ""
  ClientSecret: ""
  RedirectURL: ""

Mail:
  Driver: "smtp"
  From: ""
  Host: ""
  Port: 587
  Username: ""
  Password: ""

Llm:
  # Every secret and every endpoint comes from the environment in staging and
  # production: SECRET_ENCRYPTION_KEY seals the provider API keys at rest, and
  # LLM_DEFAULT_* describe the provider the platform offers to a workspace that
  # configured none of its own.
  SecretEncryptionKey: ""
  Default:
    Adapter: ""
    BaseURL: ""
    Model: ""
    APIKey: ""
    MaxTokens: 0
    ContextTokens: 0
  # Production enforces the token allowance; a workspace without a subscription
  # has an allowance of zero, which means unlimited until EPIC 12 (#97) lands.
  QuotaEnabled: true
  TokensPerPeriod: 0
  # How many providers one request tries before it gives up.
  ChainLimit: 3

Plan:
  # The cost ceiling of one day per workspace, in micro-rupiah. Zero means
  # unlimited. PLAN_DAILY_COST_MICROS overrides it, so a deployment can tighten
  # the ceiling without a new image.
  DailyCostMicros: 0

# What one task may spend. Every field is optional; a zero falls back to the
# product default. TASK_MAX_STEPS and the rest override them from the
# environment, so a deployment can tighten a bound without a new image.
Tasks:
  MaxSteps: 12
  MaxTokens: 120000
  MaxHandoffDepth: 2
  MaxToolResultBytes: 16384

Storage:
  # "s3" for anything deployed: MinIO, Cloudflare R2, Backblaze B2, or AWS S3.
  # The credentials come from S3_ACCESS_KEY and S3_SECRET_KEY.
  Driver: "s3"
  LocalRoot: ""
  Endpoint: ""
  Region: ""
  Bucket: ""
  AccessKey: ""
  SecretKey: ""
  UseSSL: true
  # MinIO and R2 want bucket-in-path addressing.
  PathStyle: true
  # Sandboxed HTML documents are served from this host, which must be a different
  # origin from the application: the sandbox is what makes agent-written script
  # safe to run, and a shared origin would undo it.
  ContentOrigin: ""
  # The application's own origin, which is the only one allowed to frame a
  # document. It must be listed: the content origin is a different host.
  ContentFrameAncestors: []

Logging:
  Level: "info"
  Format: "json"
