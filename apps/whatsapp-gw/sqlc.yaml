version: "2"
# sqlc reads the backend's golang-migrate files directly: the schema is one, and
# the gateway shares it rather than owning a copy. Only the queries the gateway
# runs are declared here — the device blobs and the fleet directory — so this
# module cannot grow a statement about a table the product owns.
sql:
  - engine: "postgresql"
    schema: "../../apps/backend/migrations"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "vector"
            go_type: "string"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "time"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

